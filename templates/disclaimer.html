<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disclaimer List</title>

  <!-- Bootstrap (ถ้าโดน Tracking Prevention บล็อก ก็ยังใช้งานได้ แต่บางเครื่องอาจโหลดช้า/ไม่โหลด) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <style>
    /* ========= THEME: Light default ========= */
    :root{
      --bg: #f5f7fb;
      --bg-grad: radial-gradient(900px 520px at 50% -120px, #ffffff 0%, #f5f7fb 70%);
      --ink: #0f172a;
      --muted: #475569;
      --line: rgba(15,23,42,.12);
      --card: #ffffff;
      --glass: rgba(255,255,255,.9);
      --glass-2: rgba(255,255,255,1);
      --ring: rgba(43,107,255,.22);
      --accent: #2b6bff;
      --radius: 14px;
      --shadow: 0 16px 48px rgba(20,24,40,.08);
    }

    /* ========= DARK THEME OVERRIDES ========= */
    .theme-dark{
      --bg: #0e1117;
      --bg-grad: radial-gradient(1000px 600px at 50% -100px, #1a2236 0%, #0e1117 70%);
      --ink: #e9f0ff;
      --muted: #9fb3d2;
      --line: rgba(255,255,255,.12);
      --card: rgba(0,0,0,.6);
      --glass: rgba(0,0,0,.9);
      --glass-2: rgba(0,0,0,.9);
      --ring: rgba(0,186,255,.35);
      --accent:#2b6bff;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    html, body{
      height: 100%;
      background: var(--bg);
      background-image: var(--bg-grad);
      color: var(--ink);
      transition: background .35s ease, color .35s ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* ===== Top-right Night Mode slide switch ===== */
    .mode-toggle{
      position: fixed; right: 18px; top: 18px; z-index: 2000;
      display:flex; align-items:center; gap:10px; user-select:none;
      font-weight:600; color:var(--muted);
      background: linear-gradient(180deg, var(--glass), var(--glass-2));
      border-radius: 999px; padding:10px 14px; box-shadow: var(--shadow);
      border:1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .toggle{
      width:56px; height:30px; border-radius:999px; position:relative; cursor:pointer;
      background: #e5e7eb; transition: background .25s ease, box-shadow .25s ease;
      box-shadow: inset 0 2px 6px rgba(0,0,0,.08);
    }
    .toggle::after{
      content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:999px;
      background:#ffffff; box-shadow: 0 4px 10px rgba(0,0,0,.15);
      transition: transform .25s ease;
    }
    .toggle.active{ background:#3457ff33; box-shadow: inset 0 2px 10px rgba(43,107,255,.25); }
    .toggle.active::after{ transform: translateX(26px); }
    .mode-toggle .label{ min-width:84px; text-align:right; }

    .page-wrap{
      max-width: 980px;
      margin: 76px auto 28px;
      padding: 0 14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .title{
      display:flex; align-items:center; gap:10px;
      font-weight: 900;
      font-size: 1.35rem;
    }
    .title .icon{
      width: 34px; height: 34px;
      display:grid; place-items:center;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--glass), var(--glass-2));
      border:1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .muted{ color: var(--muted); }

    .badge-fp{
      background: rgba(22,163,74,.14);
      color: #16a34a;
      border: 1px solid rgba(22,163,74,.22);
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .badge-fn{
      background: rgba(239,68,68,.14);
      color: #ef4444;
      border: 1px solid rgba(239,68,68,.22);
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .reason-pill{
      display:inline-block;
      margin: 4px 6px 0 0;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(43,107,255,.10);
      border: 1px solid rgba(43,107,255,.18);
      color: var(--ink);
      font-weight: 700;
      font-size: .85rem;
    }

    .card{
      background: linear-gradient(180deg, var(--glass), var(--glass-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .empty{
      padding: 16px;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: rgba(255,255,255,.6);
      color: var(--muted);
      text-align: left;
    }
    .theme-dark .empty{
      background: rgba(255,255,255,.04);
    }

    /* Neon + animation for timestamps/email lines in dark mode */
    .neon-text{
      color: var(--ink);
      transition: color .25s ease;
    }
    .theme-dark .neon-text{
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(0,209,255,.35),
        0 0 20px rgba(43,107,255,.20);
      animation: neonPulse 2.2s ease-in-out infinite;
    }
    @keyframes neonPulse{
      0%, 100%{ filter: brightness(1); }
      50%{ filter: brightness(1.25); }
    }

    @media (max-width: 576px){
      .page-wrap{ margin-top: 84px; }
      .mode-toggle{ right:12px; top:12px; }
      .title{ font-size: 1.15rem; }
    }
  </style>
</head>

<body>
  <!-- Night Mode slide switch (top-right) -->
  <div class="mode-toggle">
    <span class="label">โหมดกลางคืน</span>
    <div id="themeToggle" class="toggle" role="switch" aria-checked="false" tabindex="0"></div>
  </div>

  <div class="page-wrap">
    <div class="topbar">
      <div class="title">
        <div class="icon">📋</div>
        <div>รายการ Disclaimer</div>
      </div>

      <button class="btn btn-outline-secondary" onclick="goHome()">← กลับหน้าแรก</button>
    </div>

    <div class="panel">
      <div id="disclaimerList"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("firebase_token");
    if (!token) {
      alert("กรุณาเข้าสู่ระบบก่อน");
      location.href = "/";
    }

    function goHome() {
      location.href = "/";
    }

    /* ===== Theme Toggle (shared key with main page) ===== */
    const themeToggle = document.getElementById('themeToggle');
    const LS_KEY = 'phish_theme'; // 'light' | 'dark'

    function applyTheme(mode){
      if(mode === 'dark'){
        document.body.classList.add('theme-dark');
        themeToggle.classList.add('active');
        themeToggle.setAttribute('aria-checked','true');
      }else{
        document.body.classList.remove('theme-dark');
        themeToggle.classList.remove('active');
        themeToggle.setAttribute('aria-checked','false');
      }
    }
    applyTheme(localStorage.getItem(LS_KEY) || 'light');

    function toggleTheme(){
      const isDark = document.body.classList.toggle('theme-dark');
      themeToggle.classList.toggle('active', isDark);
      themeToggle.setAttribute('aria-checked', isDark ? 'true' : 'false');
      localStorage.setItem(LS_KEY, isDark ? 'dark' : 'light');
    }
    themeToggle.addEventListener('click', toggleTheme);
    themeToggle.addEventListener('keydown', (e)=> {
      if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
    });

    function formatDate(ts) {
      if (!ts) return "-";
      // Firestore Timestamp (admin returns dict sometimes: {seconds:..., nanoseconds:...})
      if (typeof ts === "object" && ts.seconds) {
        return new Date(ts.seconds * 1000).toLocaleString();
      }
      return new Date(ts).toLocaleString();
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function renderDisclaimer(item) {
      const type = item.error_type === "fp" ? "fp" : "fn";
      const badge =
        type === "fp"
          ? `<span class="badge-fp">FP</span>`
          : `<span class="badge-fn">FN</span>`;

      const reasonsArr = Array.isArray(item.reasons) ? item.reasons : [];
      const reasons = reasonsArr.map(r => `<span class="reason-pill">${escapeHtml(r)}</span>`).join("");

      const email = escapeHtml(item.email || "-");
      const url = escapeHtml(item.url || "-");
      const extra = item.extra_note ? escapeHtml(item.extra_note) : "";

      return `
        <div class="card mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <strong class="neon-text">${email}</strong>
                <div class="muted">${url}</div>
              </div>
              ${badge}
            </div>

            <div class="mt-2">
              ${reasons || "<span class='muted'>ไม่มีเหตุผลที่เลือก</span>"}
            </div>

            ${extra ? `<div class="mt-2"><strong>หมายเหตุ:</strong> ${extra}</div>` : ""}

            <div class="muted mt-2 neon-text">
              ⏱ ${escapeHtml(formatDate(item.createdAt || item.timestamp))}
            </div>
          </div>
        </div>
      `;
    }

    async function loadDisclaimers() {
      const container = document.getElementById("disclaimerList");
      container.innerHTML = `<div class="empty">กำลังโหลด...</div>`;

      try {
        const resp = await fetch("/api/disclaimers/all", {
          headers: { Authorization: "Bearer " + token }
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error((data && data.error) ? data.error : "Unauthorized");
        }

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = `<div class="empty">ยังไม่มีรายการ disclaimer</div>`;
          return;
        }

        container.innerHTML = data.map(renderDisclaimer).join("");
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="empty">ไม่สามารถโหลดข้อมูล disclaimer ได้</div>`;
        alert("ไม่สามารถโหลดข้อมูล disclaimer ได้");
      }
    }

    loadDisclaimers();
  </script>
</body>
</html>
