<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    /* === ใช้ CSS ชุดเดียวกับ profile === */
    /* (เหมือนกันทุกบรรทัด) */

    :root{
      --bg:#f5f7fb;
      --bg-grad:radial-gradient(900px 520px at 50% -120px,#fff 0%,#f5f7fb 70%);
      --ink:#0e1117;
      --muted:#4b5563;
      --glass:rgba(0,0,0,.03);
      --glass-2:rgba(0,0,0,.015);
      --line:rgba(15,23,42,.08);
      --shadow:0 16px 48px rgba(20,24,40,.08);
    }
    .theme-dark{
      --bg:#0e1117;
      --bg-grad:radial-gradient(1000px 600px at 50% -100px,#1a2236 0%,#0e1117 70%);
      --ink:#e9f0ff;
      --muted:#9fb3d2;
      --glass:rgba(255,255,255,.06);
      --glass-2:rgba(255,255,255,.03);
      --line:rgba(255,255,255,.08);
      --shadow:0 20px 60px rgba(0,0,0,.45);
    }
    html,body{
      min-height:100%;
      background:var(--bg);
      background-image:var(--bg-grad);
      color:var(--ink);
      transition:.35s;
    }

    .mode-toggle{
      position:fixed;right:18px;top:18px;z-index:2000;
      background:linear-gradient(180deg,var(--glass),var(--glass-2));
      border-radius:999px;padding:10px 14px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      display:flex;gap:10px;align-items:center;
    }
    .toggle{width:56px;height:30px;border-radius:999px;background:#e5e7eb;cursor:pointer;position:relative;}
    .toggle::after{content:"";width:24px;height:24px;border-radius:999px;background:#fff;position:absolute;top:3px;left:3px;transition:.25s;}
    .toggle.active{background:#3457ff33;}
    .toggle.active::after{transform:translateX(26px);}

    .card-glass{
      background:linear-gradient(180deg,var(--glass),var(--glass-2));
      border-radius:22px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .neon-title{font-weight:800;}
    .theme-dark .neon-title{
      color:#fff;
      text-shadow:0 0 10px rgba(0,186,255,.75),0 0 24px rgba(0,186,255,.45);
      animation:neonPulse 2.2s ease-in-out infinite;
    }

    .muted-neon{color:var(--muted);}
    .theme-dark .muted-neon{
      color:#fff;
      text-shadow:0 0 6px rgba(0,186,255,.55),0 0 14px rgba(0,186,255,.35);
      animation:neonSoft 3s ease-in-out infinite;
    }

    @keyframes neonPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.15);}}
    @keyframes neonSoft{0%,100%{opacity:.9;}50%{opacity:1;}}

    .badge-safe{background:#16a34a;}
    .badge-suspicious{background:#eab308;}
    .badge-unsafe{background:#ef4444;}
  </style>
</head>
<body>

<div class="mode-toggle">
  <span class="small">โหมดกลางคืน</span>
  <div id="themeToggle" class="toggle"></div>
</div>

<div class="container" style="max-width:900px;margin-top:90px;">
  <h3 class="mb-4 neon-title">
    <i class="bi bi-clock-history me-2"></i>ประวัติการตรวจเว็บไซต์
  </h3>

  <div id="loading" class="muted-neon">กำลังโหลด...</div>
  <div id="list" class="d-grid gap-3"></div>

  <a href="/" class="btn btn-outline-primary mt-4">← กลับหน้าหลัก</a>
</div>

<script>
const LS_KEY="phish_theme";
const toggle=document.getElementById("themeToggle");
function apply(m){
  document.documentElement.classList.toggle("theme-dark",m==="dark");
  toggle.classList.toggle("active",m==="dark");
}
apply(localStorage.getItem(LS_KEY)||"light");
toggle.onclick=()=>{
  const dark=document.documentElement.classList.toggle("theme-dark");
  toggle.classList.toggle("active",dark);
  localStorage.setItem(LS_KEY,dark?"dark":"light");
};

const token=localStorage.getItem("firebase_token");
if(!token) location.href="/";

fetch("/api/history",{headers:{Authorization:"Bearer "+token}})
.then(r=>r.json())
.then(items=>{
  loading.remove();
  if(!items.length){
    list.innerHTML="<p class='muted-neon'>ยังไม่มีประวัติ</p>";
    return;
  }
  items.forEach(i=>{
    const badge=i.result==="safe"?"badge-safe":i.result==="suspicious"?"badge-suspicious":"badge-unsafe";
    const el=document.createElement("div");
    el.className="card-glass p-3";
    el.innerHTML=`
      <div class="d-flex justify-content-between">
        <strong>${i.url}</strong>
        <span class="badge ${badge}">${i.result.toUpperCase()}</span>
      </div>
      <div class="small muted-neon">${i.timestamp}</div>
    `;
    list.appendChild(el);
  });
});
</script>
</body>
</html>
